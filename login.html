<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in &middot; SajiloBazar</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="api.js" defer></script>
    <script src="common.js" defer></script>
    <script src="login.js" defer></script>
  </head>
  <body>
    <header class="site" id="site-header"></header>
    <main>
      <div class="card" style="max-width: 420px; margin: 40px auto 0">
        <h1 style="font-size: 32px; margin: 0 0 6px">Log in</h1>
        <p style="font-size: 15px; margin: 0 0 28px" class="muted">
          Demo account: aarati@test.com / test1234
        </p>
        <div style="display: flex; flex-direction: column; gap: 18px">
          <p id="li-notice" class="notice" role="status" hidden>
            Account created — please log in.
          </p>
          <div class="field">
            <label for="li-email">Email</label
            ><input
              id="li-email"
              class="input"
              type="text"
              placeholder="you@example.com"
            />
          </div>
          <div class="field">
            <label for="li-pass">Password</label>
            <div class="password-field">
              <input
                id="li-pass"
                class="input"
                type="password"
                placeholder="Your password"
              />
              <button
                type="button"
                id="li-pass-toggle"
                class="password-toggle"
                aria-label="Show password (hold)"
                aria-pressed="false"
              >
                <svg
                  class="eye-open"
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  class="eye-closed"
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  hidden
                >
                  <path
                    d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a19.77 19.77 0 0 1 4.22-5.19"
                  />
                  <path d="M1 1l22 22" />
                  <path
                    d="M9.9 4.24A10.94 10.94 0 0 1 12 4c6.5 0 10 7 10 7a19.77 19.77 0 0 1-3.16 4.19"
                  />
                  <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88" />
                </svg>
              </button>
            </div>
          </div>
          <p id="li-error" class="error" role="alert" hidden></p>
          <button id="li-submit" class="btn btn-primary btn-block">
            Log in
          </button>
          <p style="margin: 0; font-size: 15px; text-align: center">
            No account? <a href="register.html">Register here</a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
