<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in &middot; SajiloBazar</title>
<link rel="stylesheet" href="styles.css">
<script src="common.js" defer></script>
<script src="login.js" defer></script>
</head>
<body>
<header class="site" id="site-header"></header>
<main>
<div class="card" style="max-width:420px;margin:40px auto 0">
  <h1 style="font-size:32px;margin:0 0 6px">Log in</h1>
  <p style="font-size:15px;margin:0 0 28px" class="muted">Demo account: aarati@test.com / test1234</p>
  <div style="display:flex;flex-direction:column;gap:18px">
    <div class="field"><label for="li-email">Email</label><input id="li-email" class="input" type="text" placeholder="you@example.com"></div>
    <div class="field"><label for="li-pass">Password</label><input id="li-pass" class="input" type="password" placeholder="Your password"></div>
    <p id="li-error" class="error" role="alert" hidden></p>
    <button id="li-submit" class="btn btn-primary btn-block">Log in</button>
    <p style="margin:0;font-size:15px;text-align:center">No account? <a href="register.html">Register here</a></p>
  </div>
</div>
</main>
</body>
</html>
