name: PR Checks and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          set -e
          shopt -s nullglob
          files=(*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .js files found."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Checking $f"
            node --check "$f"
          done
        shell: bash

      - name: Install HTMLHint and Stylelint
        run: npm install --no-save htmlhint stylelint stylelint-config-standard

      - name: Create Stylelint config
        run: |
          cat > .stylelintrc.json <<'EOF'
          {
            "extends": ["stylelint-config-standard"],
            "rules": {
              "no-descending-specificity": null
            }
          }
          EOF

      - name: Validate HTML
        run: npx htmlhint "*.html"

      - name: Lint CSS
        run: npx stylelint "*.css"

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Server-side build: Vercel receives the source and runs its Python
      # builder in the cloud. This avoids the fragile "upload prebuilt venv"
      # path which repeatedly failed with ENOENT on symlinked files inside
      # site-packages (attrs, .vercel/python/.venv, etc.) — see the previous
      # `vercel build --prod` + `vercel deploy --prebuilt` setup.
      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
